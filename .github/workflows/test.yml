name: MoonBit check, test, and verify

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    continue-on-error: false
    steps:
      - uses: actions/checkout@v4

      - name: Install latest stable MoonBit (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Install latest stable MoonBit (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Set-ExecutionPolicy RemoteSigned -Scope CurrentUser
          irm https://cli.moonbitlang.com/install/powershell.ps1 | iex
          "C:\Users\runneradmin\.moon\bin" | Out-File -FilePath $env:GITHUB_PATH -Append
      - name: Show toolchain and update dependencies
        run: |
          moon version --all
          moon update

      - name: Check all backends and deny warnings
        run: moon check --target all --deny-warn

      - name: Test all backends and deny warnings
        run: moon test --target all --deny-warn

      - name: Format check
        run: moon fmt --check

      - name: Public API is generated and stable
        run: |
          moon info
          git diff --exit-code -- pkg.generated.mbti
